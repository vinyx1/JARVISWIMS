<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>J.A.R.V.I.S.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Barlow:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="phone.css">
</head>
<body data-phase="start">
  <!-- The suit camera. Just the camera; say "Jarvis" and he appears. Old controls: capture-debug.html -->
  <video id="cam" autoplay playsinline muted aria-label="Camera"></video>

  <section id="start" class="start" aria-live="polite">
    <h1 class="wordmark">J.A.R.V.I.S.</h1>
    <p id="startText" class="start-text">Camera and microphone are used to find your things.</p>
    <button id="begin" class="begin" type="button">Begin</button>
  </section>

  <!-- Siri-style: pops up when he's addressed -->
  <section id="assist" class="assist" aria-live="polite" aria-hidden="true">
    <canvas id="core" class="core"></canvas>
    <p id="heard" class="heard"></p>
    <p id="said" class="said"></p>
  </section>

  <!-- Where he saw it: a wheel of photos, the one he's sure of first, then where it might be.
       Tap the photo if that's it; × if none of them is (he keeps looking). -->
  <section id="found" class="found" aria-label="Where Jarvis saw it" hidden>
    <div class="found-wheel">
      <button id="foundPrev" class="found-nav" type="button" aria-label="Previous photo">‹</button>
      <figure id="foundCard" class="found-card">
        <button id="foundShot" class="found-shot" type="button" aria-label="That's it"><img id="foundImg" alt=""></button>
        <figcaption>
          <b id="foundTag"></b>
          <span id="foundNote"></span>
          <small id="foundHint"></small>
        </figcaption>
      </figure>
      <button id="foundNext" class="found-nav" type="button" aria-label="Next photo">›</button>
    </div>
    <p id="foundCount" class="found-count"></p>
    <button id="foundClose" class="found-close" type="button" aria-label="None of these">×</button>
  </section>

  <p id="toast" class="toast" role="status" hidden></p>
  <script type="module" src="phone.js"></script>
</body>
</html>
