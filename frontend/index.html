<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>J.A.R.V.I.S.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="hud.css">
</head>
<body class="booting">
  <!-- Laptop HUD on the projector, design A "Arc Reactor". Owner: Jogindar (A); redesign by Paul with Jogindar's OK. -->
  <main class="stage" aria-label="Suit camera heads-up display">
    <!-- full-screen live feed: a blurred copy fills the screen, the real frame sits on top uncropped -->
    <img id="liveBg" class="live-bg" alt="" hidden>
    <img id="live" class="live" alt="Latest frame from the suit camera" hidden>
    <div class="scrim" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <div id="idle" class="idle">AWAITING VISUAL FEED<small>Open the capture page on the iPhone and press Start.</small></div>

    <!-- frame chrome -->
    <svg class="chrome" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true">
      <path d="M40 120V40H140M1460 40H1560V120M40 780V860H140M1560 780V860H1460"/>
    </svg>
    <div class="sweep" aria-hidden="true"></div>

    <!-- arc reactor: idle spin, gold pulse while listening, fast spin while thinking, glows with the voice -->
    <svg class="reactor" viewBox="-200 -200 400 400" aria-hidden="true">
      <circle class="r-halo" r="150"/>
      <circle class="r-ticks spin" r="132"/>
      <path class="r-arc spin rev" d="M0 -112 A112 112 0 0 1 97 56"/>
      <path class="r-arc2 spin rev" d="M-97 56 A112 112 0 0 1 -60 -95"/>
      <circle class="r-inner" r="70"/>
      <circle class="r-core" r="22"/>
      <path class="r-cross" d="M-190 0H-160M160 0H190M0 -190V-160M0 160V190"/>
    </svg>

    <header class="top">
      <div class="brand">J.A.R.V.I.S.</div>
      <div class="chips">
        <span class="k">ROOM</span><span id="room" class="v">—</span>
        <span class="k">FRAME</span><span id="frameChip" class="v">—</span>
        <span id="age" class="v dim">—</span>
        <span id="linkChip" class="chip">LINK ···</span>
        <span id="micChip" class="chip">MIC OFF</span>
      </div>
    </header>

    <div id="status" class="status">STANDBY</div>

    <!-- what the suit sees right now -->
    <ul id="objects" class="objects" aria-label="Objects and landmarks in view"></ul>

    <!-- answer: evidence photo + way back -->
    <aside id="evidence" class="evidence" hidden aria-label="Where Jarvis last saw it">
      <div class="label">LAST SEEN</div>
      <figure class="frame"><img id="heroImg" alt="Where Jarvis last saw it"></figure>
      <div class="cap"><span id="heroNote"></span><span id="heroAge"></span></div>
      <div id="trailTitle" class="label" hidden>ROUTE BACK</div>
      <ol id="trail" class="trail"></ol>
    </aside>

    <!-- subtitles: off by default (Jarvis speaks), T toggles -->
    <div id="subs" class="subs" aria-live="polite">
      <div id="subQ" class="sub-q"></div>
      <div id="subA" class="sub-a"></div>
    </div>

    <!-- typed fallback for a loud room: press / -->
    <form id="askForm" class="ask" hidden>
      <span class="prompt">&gt;</span>
      <input id="q" placeholder="Ask Jarvis…" autocomplete="off" aria-label="Question for Jarvis">
    </form>

    <div id="engage" class="engage">CLICK TO ENGAGE<small>Say "Jarvis, …" · hold Space to talk · / to type · T subtitles · R reset</small></div>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
