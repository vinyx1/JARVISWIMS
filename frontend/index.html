<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>J.A.R.V.I.S.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="hud.css">
</head>
<body class="booting">
  <!-- Laptop HUD on the projector. Owner: Jogindar (A); redesign by Paul with Jogindar's OK;
       round-two features (live preview, remember, matches, outline) from Jogindar's #19. -->
  <main class="stage" aria-label="Suit camera heads-up display">
    <!-- full-screen live feed: a blurred copy fills the screen, the real frame sits on top uncropped -->
    <img id="liveBg" class="live-bg" alt="" hidden>
    <img id="live" class="live" alt="Latest frame from the suit camera" hidden>
    <div class="vignette" aria-hidden="true"></div>

    <div id="idle" class="idle">AWAITING VISUAL FEED<small>Open the capture page on the iPhone and press Start.</small></div>

    <header class="top">
      <div class="brand">
        <!-- core: gold while listening, blinks while thinking, glows with Jarvis's voice -->
        <span class="core" aria-hidden="true"></span>
        <span class="name">J.A.R.V.I.S.</span>
        <span id="status" class="status">STANDBY</span>
      </div>
      <div class="chips">
        <span class="kv"><span class="k">ROOM</span><span id="room" class="v">—</span></span>
        <span class="kv"><span class="k">FRAME</span><span id="frameChip" class="v">—</span></span>
        <span id="age" class="dim">—</span>
        <span id="liveChip" class="chip live-chip" hidden>● LIVE</span>
        <span id="linkChip" class="chip">LINK ···</span>
        <span id="micChip" class="chip">MIC OFF</span>
      </div>
    </header>

    <!-- what the suit sees right now -->
    <section class="card objects-card" aria-label="Objects and landmarks in view">
      <div class="label">IN VIEW</div>
      <ul id="objects" class="objects"></ul>
    </section>

    <!-- items sir has registered ("this is my laptop, remember it"); hidden while empty -->
    <section id="mineCard" class="card mine-card" aria-label="My registered items" hidden>
      <div class="label">MY ITEMS</div>
      <ul id="myItems" class="my-items"></ul>
    </section>

    <!-- answer: evidence photo + way back -->
    <aside id="evidence" class="card evidence" hidden aria-label="Where Jarvis last saw it">
      <div id="evidenceTitle" class="label">LAST SEEN</div>
      <figure class="frame hero-media">
        <img id="heroImg" alt="Where Jarvis last saw it">
        <svg id="objectOutline" class="object-outline" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Selected object location in this photo" hidden><rect class="selected-object-box" /></svg>
      </figure>
      <div class="cap"><span id="heroNote"></span><span id="heroAge"></span></div>
      <div id="candidates" class="candidate-options" aria-label="Possible object matches" hidden></div>
      <div id="trailTitle" class="label" hidden>ROUTE BACK</div>
      <ol id="trail" class="trail"></ol>
    </aside>

    <!-- subtitles: off by default (Jarvis speaks), T toggles -->
    <div id="subs" class="subs" aria-live="polite">
      <div id="subQ" class="sub-q"></div>
      <div id="subA" class="sub-a"></div>
    </div>

    <!-- typed fallback for a loud room: press / -->
    <form id="askForm" class="ask" hidden>
      <span class="prompt">&gt;</span>
      <input id="q" placeholder="Ask Jarvis…" autocomplete="off" aria-label="Question for Jarvis">
    </form>

    <div id="engage" class="engage">CLICK TO ENGAGE<small>Say "Jarvis, …" · hold Space to talk · / to type · T subtitles · R reset</small></div>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
